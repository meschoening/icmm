[package]
name = "wire-gen"
version = "0.0.0"
description = "Generates the desktop's Rust wire types from wire/wire.schema.json (run by `icmm-wire gen`)"
license = "BSD-3-Clause"
edition = "2024"
publish = false

[dependencies]
prettyplease = "0.2"
schemars = "0.8.22"
serde_json = "1"
syn = "2"
typify = { version = "=0.8.0", default-features = false }
